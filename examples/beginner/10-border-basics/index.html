<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Basics</title>
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <h2>border</h2>
      <div class="card">1px solid #e0e0e0</div>
      <div class="highlight">2px solid #0066cc</div>
    </section>

    <section>
      <h2>border-width</h2>
      <div class="card-width">border-width: 1px</div>
      <div class="emphasis">border-width: 3px</div>
    </section>

    <section>
      <h2>border-style</h2>
      <div class="card-style">border-style: solid</div>
      <div class="secondary">border-style: dashed</div>
    </section>

    <section>
      <h2>border-color</h2>
      <div class="card-color">border-color: #e0e0e0</div>
      <div class="accent">border-color: #0066cc</div>
    </section>

    <section>
      <h2>border-radius</h2>
      <div class="card-radius">border-radius: 8px</div>
      <div class="avatar"></div>
    </section>

    <section>
      <h2>outline</h2>
      <button class="outline-btn">Focus me (outline + offset 2px)</button>
    </section>

    <section>
      <h2>outline-offset</h2>
      <button class="offset-btn">Focus me (outline + offset 3px)</button>
    </section>
  </body>
</html>
