<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>07 - Color Functions Basics</title>
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Color Functions Basics</h1>

    <section>
      <h2>Named Colors</h2>
      <div class="demo">
        <div class="swatch named-red">red</div>
        <div class="swatch named-blue">blue</div>
      </div>
    </section>

    <section>
      <h2>Hex Colors</h2>
      <div class="demo">
        <div class="swatch hex6">#ff5733</div>
        <div class="swatch hex3">#f00</div>
      </div>
    </section>

    <section>
      <h2>RGB / RGBA</h2>
      <div class="demo">
        <div class="swatch rgb">rgb(0,128,0)</div>
        <div class="swatch rgba">rgba(0,0,0,0.5)</div>
      </div>
    </section>

    <section>
      <h2>HSL / HSLA</h2>
      <div class="demo">
        <div class="swatch hsl">hsl(210,100%,50%)</div>
        <div class="swatch hsla">hsla(0,0%,0%,0.5)</div>
      </div>
    </section>

    <section>
      <h2>currentColor</h2>
      <div class="demo">
        <div class="current">Border matches text color via currentColor</div>
      </div>
    </section>

    <section>
      <h2>transparent</h2>
      <div class="demo">
        <button class="trans-btn">Hover me — transparent becomes solid</button>
      </div>
    </section>
  </body>
</html>
