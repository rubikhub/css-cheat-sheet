<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Basics</title>
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <h2>background-color</h2>
      <div class="card">Card with #f5f5f5</div>
      <button class="button">Hover me (#0066cc)</button>
    </section>

    <section>
      <h2>background-image</h2>
      <div class="hero-img">hero.jpg background</div>
    </section>

    <section>
      <h2>background-repeat</h2>
      <div class="pattern">repeat</div>
      <div class="no-tiling">no-repeat</div>
      <div class="round">round</div>
      <div class="space">round</div>
    </section>

    <section>
      <h2>background-size</h2>
      <div class="hero-cover">cover</div>
      <div class="contained">contain</div>
    </section>

    <section>
      <h2>background-position</h2>
      <div class="hero-position">center</div>
      <div class="corner-accent">right 20px bottom 10px</div>
    </section>

    <section>
      <h2>background (shorthand)</h2>
      <div class="hero-shorthand">url + center/cover no-repeat</div>
      <div class="card-shorthand">#f5f5f5 url repeat</div>
    </section>
  </body>
</html>
