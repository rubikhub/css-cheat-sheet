<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Cursor Styles Examples</title>
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Cursor Styles Examples</h1>

    <section class="example">
      <h2>Basic Cursor Styles</h2>
      <div class="cursor-grid">
        <div class="cursor-item cursor-pointer">pointer</div>
        <div class="cursor-item cursor-text">text</div>
        <div class="cursor-item cursor-wait">wait</div>
        <div class="cursor-item cursor-help">help</div>
      </div>
    </section>

    <section class="example">
      <h2>Action Cursor Styles</h2>
      <div class="cursor-grid">
        <div class="cursor-item cursor-move">move</div>
        <div class="cursor-item cursor-not-allowed">not-allowed</div>
        <div class="cursor-item cursor-grab">grab</div>
        <div class="cursor-item cursor-grabbing">grabbing</div>
      </div>
    </section>

    <section class="example">
      <h2>Specialized Cursor Styles</h2>
      <div class="cursor-grid">
        <div class="cursor-item cursor-crosshair">crosshair</div>
        <div class="cursor-item cursor-zoom-in">zoom-in</div>
        <div class="cursor-item cursor-zoom-out">zoom-out</div>
        <div class="cursor-item cursor-col-resize">col-resize</div>
      </div>
    </section>
    <section class="example">
      <h2>More Cursor Styles</h2>
      <div class="cursor-grid">
        <div class="cursor-item cursor-row-resize">row-resize</div>
        <div class="cursor-item cursor-none">none</div>
      </div>
    </section>

    <section class="example">
      <h2>Interactive Cursor Examples</h2>
      <div class="interactive-cursors">
        <button class="cursor-button cursor-pointer">Click me (pointer)</button>
        <div class="cursor-box cursor-move">Drag me (move)</div>
        <input
          type="text"
          class="cursor-input cursor-text"
          placeholder="Type here (text)"
        />
        <a href="#" class="cursor-link cursor-pointer"
          >Click this link (pointer)</a
        >
      </div>
    </section>
  </body>
</html>
